<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../css/cadastro.css">
    <script src="../js/cadastro.js" defer></script>

</head>

<body>
    <form onsubmit="realizarCadastro()">
        <div class="infos">
            <h1>Cadastro</h1>
            <div class="infoCad">
                <label for="userCad">Nome de Usuário</label>
                <input type="user" placeholder="Usuário" name="userCad">
                <label for="emailCad">Email</label>
                <input type="email" placeholder="Email" name="emailCad">
                <label for="senhaCad">Senha</label>
                <input type="password" placeholder="******" name="senhaCad">

            </div>

            <div class="linkCad">
                <a href="../html/login.html"><span>Logar</span></a>
            </div>

            <button type="submit" class="cadastroButton">Cadastrar</button>
        </div>

    </form>
</body>

</html>
